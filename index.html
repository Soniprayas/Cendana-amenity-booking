<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cendana Craig Ranch - Amenity Reservations</title>
<link rel="manifest" href="manifest.json" />
<style>
  :root{
    --brown:#7a5230; --cream:#f4efe8; --ink:#2c241b; --line:#e2d8c8; --accent:#a8632f;
  }
  *{box-sizing:border-box}
  body{font-family:Georgia, 'Times New Roman', serif; background:var(--cream); color:var(--ink); margin:0; padding:0;}
  header{background:var(--brown); color:#fff; padding:24px 20px; text-align:center;}
  header h1{margin:0; font-size:22px; letter-spacing:1px;}
  header p{margin:4px 0 0; font-size:13px; opacity:.85;}
  .wrap{max-width:520px; margin:0 auto; padding:20px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px;}
  label{display:block; font-weight:bold; margin-bottom:6px; margin-top:14px;}
  label:first-child{margin-top:0;}
  input, select, textarea{width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; font-size:15px; font-family:inherit;}
  textarea{min-height:70px}
  .amenity-option{border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:8px; display:flex; align-items:center; gap:10px; cursor:pointer;}
  .amenity-option input{width:auto}
  .amenity-note{font-size:12px; color:#7a6a52; margin-top:2px}
  button{background:var(--accent); color:#fff; border:none; padding:14px; border-radius:8px; font-size:16px; width:100%; margin-top:18px; cursor:pointer;}
  button:disabled{background:#ccc; cursor:not-allowed}
  .msg{padding:12px; border-radius:8px; margin-top:14px; font-size:14px;}
  .msg.ok{background:#e7f3e5; color:#2c5c22; border:1px solid #b9dcb2;}
  .msg.wait{background:#fff4e0; color:#8a5a00; border:1px solid #f0d59a;}
  .msg.err{background:#fbe4e4; color:#8a1f1f; border:1px solid #f0b3b3;}
  .hint{font-size:12px; color:#7a6a52; margin-top:4px;}
  fieldset{border:none; padding:0; margin:0;}
  .agree{display:flex; gap:8px; align-items:flex-start; margin-top:16px;}
  .agree input{width:auto; margin-top:3px;}
  .agree label{font-weight:normal; margin:0; font-size:13px;}
  #step1, #step2, #menuStep, #myResStep{display:none}
  #step1.active, #step2.active, #menuStep.active, #myResStep.active{display:block}
  .res-item{border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px;}
  .res-item .res-title{font-weight:bold;}
  .res-item .res-time{font-size:14px; color:#555; margin:4px 0;}
  .res-item .res-status{display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px; margin-top:4px;}
  .res-status.confirmed{background:#e7f3e5; color:#2c5c22;}
  .res-status.waiting{background:#fff4e0; color:#8a5a00;}
  .res-item button{background:#b34a4a; margin-top:10px; padding:8px; font-size:13px;}
  #availabilityGrid{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0;}
  .slot-btn{border:1px solid var(--line); border-radius:6px; padding:8px 6px; font-size:12px; text-align:center; min-width:64px; cursor:pointer; background:#e7f3e5; color:#2c5c22;}
  .slot-btn.selected{background:var(--accent); color:#fff; border-color:var(--accent);}
  .slot-btn.booked{background:#fbe4e4; color:#8a1f1f; cursor:not-allowed; opacity:.8;}
  .slot-btn.booked.keys-out{background:#f0d9d9;}
  .slot-legend{display:flex; gap:14px; font-size:12px; margin-bottom:6px; flex-wrap:wrap;}
  .slot-legend span{display:flex; align-items:center; gap:4px;}
  .legend-dot{width:10px; height:10px; border-radius:3px; display:inline-block;}
  .small-link{background:none; border:none; color:var(--accent); text-decoration:underline; padding:0; width:auto; margin:8px 0 0; font-size:13px;}
</style>
</head>
<body>
<header>
  <h1>CENDANA CRAIG RANCH</h1>
  <p>Amenity Reservations</p>
</header>
 
<div class="wrap">
 
  <!-- STEP 1: who are you -->
  <div class="card active" id="step1">
    <label>Name *</label>
    <input type="text" id="resName" placeholder="Your full name" />
 
    <label>Email *</label>
    <input type="email" id="resEmail" placeholder="you@email.com" />
 
    <label>Apartment Number *</label>
    <input type="text" id="resApt" placeholder="e.g. 204" />
 
    <button id="continueBtn">Continue</button>
    <div class="msg err" id="step1Error" style="display:none"></div>
  </div>
 
  <!-- STEP 1B: menu -->
  <div class="card" id="menuStep">
    <button id="newResBtn">Make a New Reservation</button>
    <button id="myResBtn" style="background:#8a7050;">My Reservations</button>
    <button class="small-link" id="backToStep1Btn">&larr; that's not me / edit my info</button>
  </div>
 
  <!-- STEP 3: my reservations -->
  <div class="card" id="myResStep">
    <h3 style="margin-top:0;">My Reservations</h3>
    <div id="myResList"></div>
    <h3 id="pastHeading" style="display:none; cursor:pointer;" onclick="document.getElementById('pastResList').style.display = document.getElementById('pastResList').style.display==='none' ? 'block' : 'none';">Past Reservations &#9662;</h3>
    <div id="pastResList" style="display:none;"></div>
    <button class="small-link" id="backFromMyResBtn">&larr; back to menu</button>
  </div>
 
  <!-- STEP 2: the booking form -->
  <div class="card" id="step2">
    <label>Which amenity would you like to reserve? *</label>
    <div id="amenityList"></div>
    <div class="hint" id="amenityDeposit" style="display:none"></div>
 
    <label>Reservation Date *</label>
    <input type="date" id="resDate" />
 
    <div id="availabilitySection" style="display:none;">
      <label style="margin-top:14px;">Availability for this day &mdash; click an open slot</label>
      <div class="slot-legend">
        <span><span class="legend-dot" style="background:#e7f3e5;"></span>Open</span>
        <span><span class="legend-dot" style="background:#fbe4e4;"></span>Booked</span>
        <span><span class="legend-dot" style="background:#f0d9d9;"></span>Booked, keys still out</span>
      </div>
      <div id="availabilityGrid"></div>
    </div>
 
    <label>Start Time *</label>
    <input type="time" id="resStart" />
    <div class="hint">Or click a slot above to fill this in automatically.</div>
 
    <label>Duration *</label>
    <select id="resDuration">
      <option value="60">1 hour</option>
      <option value="120">2 hours</option>
      <option value="180">3 hours</option>
      <option value="240">4 hours</option>
    </select>
    <div class="hint" id="durationHint">Maximum reservation length is 4 hours.</div>
    <div class="hint" id="closingNote" style="display:none; color:#8a5a00; font-weight:bold;"></div>
 
    <label>Number of Guests (if applicable)</label>
    <input type="number" id="resGuests" min="0" value="0" />
    <div class="hint" id="guestCapHint"></div>
 
    <label>Additional questions or comments</label>
    <textarea id="resComments"></textarea>
 
    <div class="agree">
      <input type="checkbox" id="resAgree" />
      <label>By checking this box, I agree that I have read and understand the amenity reservation agreement.</label>
    </div>
 
    <button id="submitBtn">Submit Reservation</button>
    <button class="small-link" id="backBtn">&larr; back</button>
    <div id="resultMsg"></div>
  </div>
 
</div>
 
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== CONFIG - your Supabase project ======
const SUPABASE_URL = "https://uqqbgopausdgirnezxfh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxcWJnb3BhdXNkZ2lybmV6eGZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDkzNzAsImV4cCI6MjEwMjE4NTM3MH0.csX9-u9jrc-p0j4x7tKfuQ7ky_HqGIovvglr8zniCSA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});
 
let amenities = [];
let amenityHours = [];
let officeHours = [];
let settings = { enforce_apartment_list: false, max_advance_booking_days: 90 };
let resident = { name: "", email: "", apt: "" };
let selectedAmenity = null;
 
// ---------- STEP 1 ----------
document.getElementById("continueBtn").onclick = async () => {
  const name = document.getElementById("resName").value.trim();
  const email = document.getElementById("resEmail").value.trim();
  const apt = document.getElementById("resApt").value.trim();
  const errBox = document.getElementById("step1Error");
  errBox.style.display = "none";
 
  if (!name || !email || !apt) {
    errBox.textContent = "Please fill in your name, email, and apartment number.";
    errBox.style.display = "block";
    return;
  }
 
  // check apartment list only if enforcement is turned on in app_settings
  if (settings.enforce_apartment_list) {
    const { data, error } = await sb.from("apartments").select("unit_number").eq("unit_number", apt).eq("active", true).maybeSingle();
    if (error || !data) {
      errBox.textContent = "We don't recognize that apartment number. Please contact the leasing office.";
      errBox.style.display = "block";
      return;
    }
  }
 
  resident = { name, email, apt };
  document.getElementById("step1").classList.remove("active");
  document.getElementById("menuStep").classList.add("active");
};
 
document.getElementById("newResBtn").onclick = () => {
  document.getElementById("menuStep").classList.remove("active");
  document.getElementById("step2").classList.add("active");
};
 
document.getElementById("myResBtn").onclick = () => {
  document.getElementById("menuStep").classList.remove("active");
  document.getElementById("myResStep").classList.add("active");
  loadMyReservations();
};
 
document.getElementById("backToStep1Btn").onclick = () => {
  document.getElementById("resName").value = resident.name;
  document.getElementById("resEmail").value = resident.email;
  document.getElementById("resApt").value = resident.apt;
  document.getElementById("menuStep").classList.remove("active");
  document.getElementById("step1").classList.add("active");
  document.getElementById("step1Error").style.display = "none";
};
 
document.getElementById("backFromMyResBtn").onclick = () => {
  document.getElementById("myResStep").classList.remove("active");
  document.getElementById("menuStep").classList.add("active");
};
 
document.getElementById("backBtn").onclick = () => {
  document.getElementById("step2").classList.remove("active");
  document.getElementById("menuStep").classList.add("active");
  document.getElementById("resultMsg").innerHTML = "";
};
 
// ---------- LOAD AMENITIES + SETTINGS ----------
async function loadData() {
  const { data: settingsRow } = await sb.from("app_settings").select("*").eq("id", 1).single();
  if (settingsRow) settings = settingsRow;
 
  const { data: amenityRows } = await sb.from("amenities").select("*").eq("active", true).order("name");
  amenities = amenityRows || [];
 
  const { data: hourRows } = await sb.from("amenity_hours").select("*");
  amenityHours = hourRows || [];
 
  const { data: officeRows } = await sb.from("office_hours").select("*");
  officeHours = officeRows || [];
 
  const list = document.getElementById("amenityList");
  list.innerHTML = "";
  amenities.forEach((a, i) => {
    const div = document.createElement("div");
    div.className = "amenity-option";
    div.innerHTML = `
      <input type="radio" name="amenity" value="${a.id}" id="amenity_${i}" />
      <label for="amenity_${i}" style="margin:0; font-weight:normal;">${a.name}
        <div class="amenity-note">Up to ${a.max_guests} guests${a.requires_deposit ? " &middot; $" + a.deposit_amount + " refundable deposit required at leasing office" : ""}</div>
      </label>`;
    div.querySelector("input").onchange = () => {
      selectedAmenity = a;
      document.getElementById("guestCapHint").textContent = "Maximum " + a.max_guests + " guests for this space.";
      const depoBox = document.getElementById("amenityDeposit");
      if (a.requires_deposit) {
        depoBox.style.display = "block";
        depoBox.textContent = "Note: this space requires a $" + a.deposit_amount + " refundable deposit, payable at the leasing office.";
      } else {
        depoBox.style.display = "none";
      }
      updateDurationOptions();
      renderAvailability();
    };
    list.appendChild(div);
  });
 
  // set date limits
  const dateInput = document.getElementById("resDate");
  const today = new Date();
  const maxDate = new Date();
  maxDate.setDate(today.getDate() + settings.max_advance_booking_days);
  dateInput.min = today.toISOString().split("T")[0];
  dateInput.max = maxDate.toISOString().split("T")[0];
}
loadData();
 
// ---------- DYNAMIC DURATION OPTIONS ----------
// Shrinks the duration dropdown so a booking can never run past that amenity's closing time
// (this is what naturally produces "8pm -> max 3 hours, 9pm -> max 2 hours" for a space that closes at 11pm)
function updateDurationOptions() {
  const durationSelect = document.getElementById("resDuration");
  const hint = document.getElementById("durationHint");
  const closingNote = document.getElementById("closingNote");
  const date = document.getElementById("resDate").value;
  const startStr = document.getElementById("resStart").value;
 
  if (!selectedAmenity || !date || !startStr) return; // not enough info yet, leave defaults
 
  const startTime = new Date(`${date}T${startStr}:00`);
  const dow = startTime.getDay();
  const hoursRow = amenityHours.find(h => h.amenity_id === selectedAmenity.id && h.day_of_week === dow);
 
  durationSelect.innerHTML = "";
  closingNote.style.display = "none";
 
  if (!hoursRow || !hoursRow.open_time || !hoursRow.close_time) {
    durationSelect.innerHTML = '<option value="">Closed this day</option>';
    hint.textContent = "This amenity is closed on the selected day.";
    return;
  }
 
  const openTime = new Date(`${date}T${hoursRow.open_time}`);
  const closeTime = new Date(`${date}T${hoursRow.close_time}`);
 
  if (startTime < openTime || startTime >= closeTime) {
    durationSelect.innerHTML = '<option value="">Outside business hours</option>';
    hint.textContent = `Open ${hoursRow.open_time.slice(0,5)} - ${hoursRow.close_time.slice(0,5)} on this day.`;
    return;
  }
 
  const maxMinutes = Math.floor((closeTime - startTime) / 60000);
  const allOptions = [60, 120, 180, 240];
  const validOptions = allOptions.filter(m => m <= maxMinutes);
 
  if (validOptions.length === 0) {
    durationSelect.innerHTML = '<option value="">No duration fits before closing</option>';
    hint.textContent = `Closes at ${hoursRow.close_time.slice(0,5)} — pick an earlier start time.`;
    return;
  }
 
  validOptions.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = (m / 60) + (m === 60 ? " hour" : " hours");
    durationSelect.appendChild(opt);
  });
  hint.textContent = `Closes at ${hoursRow.close_time.slice(0,5)} on this day.`;
 
  // late-evening warning: only relevant for spaces open into the evening (close at/after 9pm)
  if (closeTime.getHours() >= 21 && startTime.getHours() >= 20) {
    closingNote.style.display = "block";
    closingNote.textContent = `Please plan accordingly — ${selectedAmenity.name} closes at ${hoursRow.close_time.slice(0,5)}. You must exit by then.`;
  }
}
document.getElementById("resDate").addEventListener("change", () => { updateDurationOptions(); renderAvailability(); });
document.getElementById("resStart").addEventListener("change", updateDurationOptions);
 
// ---------- AVAILABILITY CALENDAR (booking page) ----------
async function renderAvailability() {
  const section = document.getElementById("availabilitySection");
  const grid = document.getElementById("availabilityGrid");
  const date = document.getElementById("resDate").value;
 
  if (!selectedAmenity || !date) { section.style.display = "none"; return; }
 
  const dow = new Date(`${date}T00:00:00`).getDay();
  const hoursRow = amenityHours.find(h => h.amenity_id === selectedAmenity.id && h.day_of_week === dow);
  if (!hoursRow || !hoursRow.open_time || !hoursRow.close_time) {
    section.style.display = "block";
    grid.innerHTML = "<p>Closed this day.</p>";
    return;
  }
 
  section.style.display = "block";
  grid.innerHTML = "Loading availability...";
 
  const dayStart = new Date(`${date}T00:00:00`).toISOString();
  const dayEnd = new Date(`${date}T23:59:59`).toISOString();
  const { data: dayBookings } = await sb
    .from("bookings")
    .select("start_time, end_time, key_picked_up")
    .eq("amenity_id", selectedAmenity.id)
    .eq("status", "confirmed")
    .lt("start_time", dayEnd)
    .gt("end_time", dayStart);
 
  grid.innerHTML = "";
  const openTime = new Date(`${date}T${hoursRow.open_time}`);
  const closeTime = new Date(`${date}T${hoursRow.close_time}`);
 
  // build 30-minute slots across the open window
  for (let t = new Date(openTime); t < closeTime; t = new Date(t.getTime() + 30 * 60000)) {
    const slotEnd = new Date(t.getTime() + 30 * 60000);
    const covering = (dayBookings || []).find(b => new Date(b.start_time) < slotEnd && new Date(b.end_time) > t);
 
    const btn = document.createElement("div");
    const timeLabel = t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    btn.textContent = timeLabel;
 
    if (covering) {
      btn.className = "slot-btn booked" + (!covering.key_picked_up ? " keys-out" : "");
      btn.title = covering.key_picked_up ? "Booked" : "Booked \u2014 keys not yet picked up";
    } else {
      btn.className = "slot-btn";
      btn.title = "Click to select this start time";
      btn.onclick = () => {
        document.querySelectorAll(".slot-btn.selected").forEach(el => el.classList.remove("selected"));
        btn.classList.add("selected");
        document.getElementById("resStart").value = t.toTimeString().slice(0, 5);
        updateDurationOptions();
      };
    }
    grid.appendChild(btn);
  }
}
 
// ---------- SUBMIT ----------
document.getElementById("submitBtn").onclick = async () => {
  const resultBox = document.getElementById("resultMsg");
  resultBox.innerHTML = "";
 
  if (!selectedAmenity) return showMsg("err", "Please select an amenity.");
  const date = document.getElementById("resDate").value;
  const startStr = document.getElementById("resStart").value;
  const duration = parseInt(document.getElementById("resDuration").value, 10);
  const guests = parseInt(document.getElementById("resGuests").value || "0", 10);
  const comments = document.getElementById("resComments").value.trim();
  const agreed = document.getElementById("resAgree").checked;
 
  if (!date || !startStr) return showMsg("err", "Please choose a date and start time.");
  if (!agreed) return showMsg("err", "You must agree to the reservation agreement to continue.");
  if (guests > selectedAmenity.max_guests) return showMsg("err", `This space allows a maximum of ${selectedAmenity.max_guests} guests.`);
 
  const startTime = new Date(`${date}T${startStr}:00`);
  const endTime = new Date(startTime.getTime() + duration * 60000);
 
  // ---- check business hours ----
  const dow = startTime.getDay();
  const hoursRow = amenityHours.find(h => h.amenity_id === selectedAmenity.id && h.day_of_week === dow);
  if (!hoursRow || !hoursRow.open_time || !hoursRow.close_time) {
    return showMsg("err", "This amenity is closed on the selected day.");
  }
  const openTime = new Date(`${date}T${hoursRow.open_time}`);
  const closeTime = new Date(`${date}T${hoursRow.close_time}`);
  if (startTime < openTime || endTime > closeTime) {
    return showMsg("err", `Reservations must fit within business hours: ${hoursRow.open_time.slice(0,5)} - ${hoursRow.close_time.slice(0,5)} on this day.`);
  }
 
  // ---- check for overlap with existing confirmed bookings ----
  const { data: overlaps, error: overlapErr } = await sb
    .from("bookings")
    .select("id")
    .eq("amenity_id", selectedAmenity.id)
    .eq("status", "confirmed")
    .lt("start_time", endTime.toISOString())
    .gt("end_time", startTime.toISOString());
 
  if (overlapErr) return showMsg("err", "Something went wrong checking availability. Please try again.");
 
  if (overlaps && overlaps.length > 0) {
    // slot taken -> join waitlist
    const { data: waitRow, error: waitErr } = await sb.from("waitlist").insert({
      amenity_id: selectedAmenity.id,
      resident_name: resident.name,
      resident_email: resident.email,
      apartment_number: resident.apt,
      start_time: startTime.toISOString(),
      end_time: endTime.toISOString(),
      guests, comments
    }).select().single();
 
    if (waitErr) return showMsg("err", "Something went wrong joining the waitlist. Please try again.");
 
    const { count } = await sb
      .from("waitlist")
      .select("id", { count: "exact", head: true })
      .eq("amenity_id", selectedAmenity.id)
      .eq("status", "waiting")
      .lt("start_time", endTime.toISOString())
      .gt("end_time", startTime.toISOString());
 
    showMsg("wait", `That time is already booked. You've been added to the waitlist — you are position #${count}. ${count === 1 ? "You're first in line: if the current holder does not pick up their keys, this room may become available to you." : ""} We'll email you if it opens up.`);
    return;
  }
 
  // ---- no overlap -> confirm booking ----
  const { error: insertErr } = await sb.from("bookings").insert({
    amenity_id: selectedAmenity.id,
    resident_name: resident.name,
    resident_email: resident.email,
    apartment_number: resident.apt,
    start_time: startTime.toISOString(),
    end_time: endTime.toISOString(),
    guests, comments
  });
 
  if (insertErr) return showMsg("err", "Something went wrong submitting your reservation. Please try again.");
 
  const pickupInstructions = getPickupInstructions(selectedAmenity, startTime, date);
  showMsg("ok", `Your reservation for ${selectedAmenity.name} is confirmed for ${startTime.toLocaleString()}. ${pickupInstructions}`);
};
 
// Cinema bookings can start after the leasing office itself has closed for the day (extended hours to 11pm).
// In that case, fob pickup has to happen before the office closes -- not "at reservation start time".
function getPickupInstructions(amenity, startTime, dateStr) {
  const standard = "Please pick up your fob from the leasing office at your reservation start time.";
  if (amenity.name !== "Cinema Theater") return standard;
 
  const dow = startTime.getDay();
  const officeRow = officeHours.find(h => h.day_of_week === dow);
  if (!officeRow || !officeRow.close_time) return standard;
 
  const officeClose = new Date(`${dateStr}T${officeRow.close_time}`);
  if (startTime >= officeClose) {
    const closeStr = officeClose.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    return `Since this is after the leasing office's normal hours, please pick up your fob from the leasing office 15 minutes before office closing time (by around ${closeStr}) rather than at your reservation start time.`;
  }
  return standard;
}
 
function showMsg(type, text) {
  document.getElementById("resultMsg").innerHTML = `<div class="msg ${type}">${text}</div>`;
}
 
// ---------- MY RESERVATIONS ----------
async function loadMyReservations() {
  const listBox = document.getElementById("myResList");
  const pastBox = document.getElementById("pastResList");
  const pastHeading = document.getElementById("pastHeading");
  listBox.innerHTML = "Loading...";
  pastBox.innerHTML = "";
 
  const nowIso = new Date().toISOString();
  const amenitySelect = "*, amenities(name, requires_deposit, deposit_amount)";
 
  const { data: myBookings } = await sb
    .from("bookings").select(amenitySelect)
    .eq("resident_email", resident.email).eq("apartment_number", resident.apt)
    .eq("status", "confirmed").gt("end_time", nowIso).order("start_time");
 
  const { data: myWaitlist } = await sb
    .from("waitlist").select(amenitySelect)
    .eq("resident_email", resident.email).eq("apartment_number", resident.apt)
    .eq("status", "waiting").gt("end_time", nowIso).order("start_time");
 
  const { data: pastBookings } = await sb
    .from("bookings").select(amenitySelect)
    .eq("resident_email", resident.email).eq("apartment_number", resident.apt)
    .in("status", ["confirmed", "cancelled"]).lte("end_time", nowIso)
    .order("start_time", { ascending: false }).limit(10);
 
  listBox.innerHTML = "";
 
  if ((!myBookings || myBookings.length === 0) && (!myWaitlist || myWaitlist.length === 0)) {
    listBox.innerHTML = "<p>You have no upcoming reservations or waitlist entries.</p>";
  }
 
  for (const b of (myBookings || [])) {
    const div = document.createElement("div");
    div.className = "res-item";
    div.innerHTML = `
      <div class="res-title">${b.amenities.name}</div>
      <div class="res-time">${new Date(b.start_time).toLocaleString()} &ndash; ${new Date(b.end_time).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}</div>
      <span class="res-status confirmed">Confirmed</span>
      <div class="res-time">${timeRemainingText(b.start_time, b.end_time)}</div>
      <div class="res-time">${keyStatusText(b)}</div>
      ${depositReminderHtml(b)}
      <button data-id="${b.id}" data-type="booking">Give Up / Cancel This Reservation</button>`;
    div.querySelector("button").onclick = (e) => cancelReservation(b.id, "booking", e.target);
    listBox.appendChild(div);
  }
 
  for (const w of (myWaitlist || [])) {
    const position = await waitlistPosition(w);
    const div = document.createElement("div");
    div.className = "res-item";
    div.innerHTML = `
      <div class="res-title">${w.amenities.name}</div>
      <div class="res-time">${new Date(w.start_time).toLocaleString()} &ndash; ${new Date(w.end_time).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}</div>
      <span class="res-status waiting">Waiting &mdash; position #${position}</span>
      <button data-id="${w.id}" data-type="waitlist">Leave Waitlist</button>`;
    div.querySelector("button").onclick = (e) => cancelReservation(w.id, "waitlist", e.target);
    listBox.appendChild(div);
  }
 
  // Past reservations (collapsed by default)
  pastBox.innerHTML = "";
  if (pastBookings && pastBookings.length > 0) {
    pastHeading.style.display = "block";
    pastBookings.forEach(b => {
      const div = document.createElement("div");
      div.className = "res-item";
      const statusLabel = b.status === "cancelled" ? "Cancelled" : "Completed";
      div.innerHTML = `
        <div class="res-title">${b.amenities.name}</div>
        <div class="res-time">${new Date(b.start_time).toLocaleString()}</div>
        <span class="res-status confirmed">${statusLabel}</span>`;
      pastBox.appendChild(div);
    });
  } else {
    pastHeading.style.display = "none";
  }
}
 
function timeRemainingText(startIso, endIso) {
  const now = new Date();
  const start = new Date(startIso);
  const end = new Date(endIso);
  if (now < start) {
    const mins = Math.round((start - now) / 60000);
    if (mins < 60) return `Starts in ${mins} minute${mins === 1 ? "" : "s"}`;
    const hrs = Math.round(mins / 60);
    return `Starts in about ${hrs} hour${hrs === 1 ? "" : "s"}`;
  }
  if (now >= start && now < end) {
    const mins = Math.round((end - now) / 60000);
    return `In progress &mdash; ends in ${mins} minute${mins === 1 ? "" : "s"}`;
  }
  return "";
}
 
function keyStatusText(b) {
  if (b.key_returned) return "Key: picked up and returned.";
  if (b.key_picked_up) return "Key: picked up, not yet returned.";
  return "Key: not yet picked up from the leasing office.";
}
 
function depositReminderHtml(b) {
  if (!b.amenities.requires_deposit || b.deposit_paid) return "";
  return `<div class="msg wait" style="margin-top:8px;">Reminder: a $${b.amenities.deposit_amount} refundable deposit is required for this space. Please pay it at the leasing office if you haven't already.</div>`;
}
 
async function waitlistPosition(w) {
  const { count } = await sb
    .from("waitlist").select("id", { count: "exact", head: true })
    .eq("amenity_id", w.amenity_id).eq("status", "waiting")
    .lt("start_time", w.end_time).gt("end_time", w.start_time)
    .lte("created_at", w.created_at);
  return count || 1;
}
 
async function cancelReservation(id, type, btn) {
  btn.disabled = true;
  btn.textContent = "Cancelling...";
 
  if (type === "waitlist") {
    await sb.from("waitlist").update({ status: "cancelled" }).eq("id", id);
    loadMyReservations();
    return;
  }
 
  // type === "booking": fetch it first so we know amenity/time to promote the right waitlist entry
  const { data: booking } = await sb.from("bookings").select("*").eq("id", id).single();
  if (!booking) { loadMyReservations(); return; }
 
  await sb.from("bookings").update({ status: "cancelled" }).eq("id", id);
  await promoteNextWaitlisted(booking);
  loadMyReservations();
}
 
// Finds the earliest-joined ("waiting") waitlist entry that overlapped this now-cancelled booking,
// and confirms it -- matches our FIFO rule, and fires immediately on cancellation (not the 45-min timeout).
async function promoteNextWaitlisted(cancelledBooking) {
  const { data: candidates } = await sb
    .from("waitlist")
    .select("*")
    .eq("amenity_id", cancelledBooking.amenity_id)
    .eq("status", "waiting")
    .lt("start_time", cancelledBooking.end_time)
    .gt("end_time", cancelledBooking.start_time)
    .order("created_at", { ascending: true })
    .limit(1);
 
  if (!candidates || candidates.length === 0) return;
  const next = candidates[0];
 
  await sb.from("bookings").insert({
    amenity_id: next.amenity_id,
    resident_name: next.resident_name,
    resident_email: next.resident_email,
    apartment_number: next.apartment_number,
    start_time: next.start_time,
    end_time: next.end_time,
    guests: next.guests,
    comments: next.comments
  });
  await sb.from("waitlist").update({ status: "promoted" }).eq("id", next.id);
  // Note: the promoted resident finding out is email-based (Phase 6) -- not shown live in this browser tab.
}
</script>
